name: Build LG webOS IPK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create dummy icon.png
      run: |
        curl -s -o icon.png "https://dummyimage.com/80x80/e50914/ffffff.png&text=CB"

    - name: Install webOS CLI
      run: npm install -g @webosose/ares-cli

    - name: Build IPK Package
      run: ares-package .

    - name: Upload IPK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CinemaBox-LG-IPK
        path: "*.ipk"
