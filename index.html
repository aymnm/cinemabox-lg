<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Box TV</title>
    <style>
        :root {
            --primary: #e50914;
            --bg-dark: #08080a;
            --bg-card: #121318;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* شريط التنقل العلوي */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background-color: var(--primary);
            color: #fff;
            font-weight: bold;
            font-size: 22px;
            padding: 6px 14px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 20px;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:focus, .nav-tab.active {
            color: #fff;
            background-color: rgba(229, 9, 20, 0.2);
            border-color: var(--primary);
            outline: none;
            transform: scale(1.05);
        }

        /* منطقة المحتوى الرئيسية */
        .main-container {
            height: 100vh;
            overflow-y: auto;
            padding: 100px 40px 40px 40px;
            scroll-behavior: smooth;
        }

        /* البانر الرئيسي */
        .hero {
            position: relative;
            width: 100%;
            height: 360px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: inset 0 -150px 90px rgba(8,8,10,1);
        }

        .hero-info h1 {
            font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-info p {
            color: var(--text-sub);
            font-size: 15px;
            max-width: 650px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-play {
            background-color: var(--primary);
            color: white;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid transparent;
            cursor: pointer;
            display: inline-block;
        }

        .btn-play:focus {
            border-color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
            outline: none;
        }

        /* القوائم الأفقية */
        .section-header {
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header::before {
            content: '';
            width: 5px;
            height: 20px;
            background-color: var(--primary);
            border-radius: 3px;
        }

        .media-row {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding: 10px 5px;
            scroll-behavior: smooth;
        }

        .media-row::-webkit-scrollbar { display: none; }

        .card {
            min-width: 160px;
            width: 160px;
            height: 240px;
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 100%);
            padding: 12px 8px 8px 8px;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card:focus {
            border-color: var(--primary);
            transform: scale(1.1);
            z-index: 10;
            outline: none;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.7);
        }

        /* مشغل الفيديو */
        #player-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
        }

        video { width: 100%; height: 100%; }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-size: 20px; color: #ccc;">جاري الاتصال بسيرفر Cinema Box...</div>
    </div>

    <!-- الهيدر العلوي -->
    <div class="navbar">
        <div class="brand">
            <div class="brand-logo">CB</div>
            <div class="brand-name">Cinema Box</div>
        </div>
        <div class="nav-links">
            <div class="nav-tab active" tabindex="0">الرئيسية</div>
            <div class="nav-tab" tabindex="0">أفلام</div>
            <div class="nav-tab" tabindex="0">مسلسلات</div>
            <div class="nav-tab" tabindex="0">مباشر</div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <!-- البانر -->
        <div id="hero-banner" class="hero" style="background-image: url('https://via.placeholder.com/1200x400/111/333?text=Cinema+Box');">
            <div class="hero-info">
                <h1 id="hero-title">جاري جلب العروض...</h1>
                <p id="hero-desc">استمتع بآلاف الأفلام والمسلسلات الحصرية مباشرة عبر شبكتك المحلية.</p>
                <button id="hero-play-btn" class="btn-play" tabindex="0">مشاهدة الآن</button>
            </div>
        </div>

        <!-- صفوف القوائم -->
        <div class="section-header">أحدث الإضافات</div>
        <div id="latest-row" class="media-row"></div>

        <div class="section-header">الأكثر مشاهدة</div>
        <div id="popular-row" class="media-row"></div>
    </div>

    <!-- مشغل الفيديو -->
    <div id="player-overlay">
        <video id="tv-player" controls autoplay></video>
    </div>

    <script>
        const APIS = [
            "https://cinema.albox.co/api/v4/main",
            "https://pucinema.albox.co/api/v4/main"
        ];

        let currentHeroItem = null;

        async function loadAppData() {
            let resultData = null;

            for (let endpoint of APIS) {
                try {
                    let res = await fetch(endpoint);
                    if (res.ok) {
                        resultData = await res.json();
                        break;
                    }
                } catch (e) {
                    console.log("خطأ في السيرفر:", endpoint);
                }
            }

            document.getElementById("loader").style.display = "none";

            if (resultData) {
                buildInterface(resultData);
            } else {
                document.getElementById("hero-title").innerText = "فشل الاتصال بمزود الخدمة";
                document.getElementById("hero-desc").innerText = "يرجى التأكد من أن التلفاز متصل بالواي فاي التابع لشبكة الإنترنت المحلية المدعومة.";
            }
        }

        function buildInterface(data) {
            const list = data.items || data.data || data || [];

            if (list.length > 0) {
                currentHeroItem = list[0];
                document.getElementById("hero-title").innerText = currentHeroItem.title || currentHeroItem.name || "عرض مميز";
                if (currentHeroItem.poster || currentHeroItem.image) {
                    document.getElementById("hero-banner").style.backgroundImage = `url('${currentHeroItem.poster || currentHeroItem.image}')`;
                }

                document.getElementById("hero-play-btn").onclick = () => playMedia(currentHeroItem);

                populateRow("latest-row", list.slice(0, 12));
                populateRow("popular-row", list.slice(12, 24).length > 0 ? list.slice(12, 24) : list.slice(0, 12));
            }

            const firstTab = document.querySelector(".nav-tab");
            if (firstTab) firstTab.focus();
        }

        function populateRow(rowId, items) {
            const rowElem = document.getElementById(rowId);
            rowElem.innerHTML = "";

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.tabIndex = 0;

                const img = item.poster || item.image || "https://via.placeholder.com/160x240?text=CinemaBox";
                const title = item.title || item.name || "عنوان العرض";

                card.innerHTML = `
                    <img src="${img}" alt="${title}" onerror="this.src='https://via.placeholder.com/160x240?text=CinemaBox'" />
                    <div class="card-title">${title}</div>
                `;

                card.addEventListener("click", () => playMedia(item));
                card.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.keyCode === 13) playMedia(item);
                });

                rowElem.appendChild(card);
            });
        }

        function playMedia(item) {
            const url = item.stream_url || item.url || (item.links && item.links[0] ? item.links[0].url : null);
            if (url) {
                const overlay = document.getElementById("player-overlay");
                const video = document.getElementById("tv-player");
                video.src = url;
                overlay.style.display = "block";
                video.play();
            } else {
                alert("رابط البث غير متوفر حالياً لهذا العنصر.");
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.keyCode === 461 || e.key === "Backspace" || e.key === "Escape") {
                const overlay = document.getElementById("player-overlay");
                if (overlay.style.display === "block") {
                    overlay.style.display = "none";
                    document.getElementById("tv-player").pause();
                    e.preventDefault();
                }
            }
        });

        window.onload = loadAppData;
    </script>
</body>
</html>
